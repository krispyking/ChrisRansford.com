<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KrispyKing ✈ Cathay Travel Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#0a0f1e;color:#e8eaf6;min-height:100vh}
  header{background:linear-gradient(135deg,#00264d,#004080);padding:24px 32px;display:flex;align-items:center;gap:16px;border-bottom:2px solid #00b4d8}
  header svg{flex-shrink:0}
  header h1{font-size:1.6rem;font-weight:700;color:#fff}
  header span{font-size:0.9rem;color:#90caf9;margin-left:auto}
  .container{max-width:1300px;margin:0 auto;padding:24px 16px}

  /* DATE SLIDER */
  .date-slider-wrap{background:#0d1b2a;border:1px solid #1a3a5c;border-radius:12px;padding:16px 20px;margin-bottom:24px}
  .date-slider-label{font-size:0.85rem;color:#546e7a;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .date-slider{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .date-slider::-webkit-scrollbar{height:4px}
  .date-slider::-webkit-scrollbar-thumb{background:#1a3a5c;border-radius:4px}
  .date-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:10px 16px;border-radius:10px;border:2px solid #1a3a5c;background:#162032;cursor:pointer;transition:all 0.2s;min-width:80px;user-select:none}
  .date-chip:hover{border-color:#2a5080;background:#1a2a44}
  .date-chip.active{border-color:#00b4d8;background:linear-gradient(135deg,#00264d,#004080);box-shadow:0 0 12px rgba(0,180,216,0.3)}
  .date-chip .day-name{font-size:0.75rem;font-weight:700;color:#90caf9;text-transform:uppercase;letter-spacing:0.5px}
  .date-chip.active .day-name{color:#fff}
  .date-chip .day-num{font-size:1.4rem;font-weight:700;color:#fff;line-height:1.2}
  .date-chip .month{font-size:0.7rem;color:#546e7a;text-transform:uppercase}
  .date-chip.active .month{color:#90caf9}
  .date-chip.today .day-name{color:#00b4d8}
  .date-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .date-nav button{background:#162032;border:1px solid #1a3a5c;color:#90caf9;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:0.85rem;transition:all 0.2s}
  .date-nav button:hover{background:#1a2a44;border-color:#00b4d8}
  .selected-date-display{font-size:1rem;font-weight:700;color:#fff;flex:1;text-align:center}

  /* STATS BAR */
  .stats-bar{background:linear-gradient(135deg,#00264d,#003366);border:1px solid #00b4d8;border-radius:12px;padding:18px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat .stat-num{font-size:2.2rem;font-weight:800;color:#00b4d8;line-height:1}
  .stat .stat-label{font-size:0.78rem;color:#90caf9;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px}

  /* MAP */
  .section-title{font-size:1.1rem;font-weight:700;color:#90caf9;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  #map{width:100%;height:420px;border-radius:14px;border:1px solid #1a3a5c;margin-bottom:24px;z-index:1}
  .map-tip{background:#162032!important;border:1px solid #00b4d8!important;color:#fff!important;font-size:0.82rem!important;font-weight:600!important;border-radius:6px!important;box-shadow:none!important}
  .map-tip::before{border-top-color:#00b4d8!important}

  /* CARDS */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{background:#0d1b2a;border:1px solid #1a3a5c;border-radius:14px;overflow:hidden;transition:transform 0.2s,border-color 0.2s;cursor:pointer}
  .card:hover,.card.active{transform:translateY(-3px);border-color:#00b4d8}
  .card.no-flight{opacity:0.5;cursor:default}
  .card.no-flight:hover{transform:none;border-color:#1a3a5c}
  .card-head{background:linear-gradient(90deg,#00264d,#003366);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .card-head .dest{font-size:1.05rem;font-weight:700;color:#fff}
  .card-head .iata{background:#00b4d8;color:#fff;border-radius:6px;padding:2px 8px;font-size:0.78rem;font-weight:700}
  .card-body{padding:14px 18px}
  .flight-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:0.88rem}
  .flight-row .fn{color:#90caf9;font-weight:600;min-width:60px}
  .flight-row .times{color:#e8eaf6}
  .flight-row .freq{color:#b0bec5;font-size:0.78rem}
  .weather-block{margin-top:10px;padding-top:10px;border-top:1px solid #1a3a5c;display:flex;align-items:center;gap:10px}
  .weather-block img{width:40px;height:40px}
  .weather-block .wt{font-size:1.2rem;font-weight:700;color:#fff}
  .weather-block .wd{font-size:0.82rem;color:#b0bec5}
  .no-flight-msg{padding:4px 0;color:#546e7a;font-style:italic;font-size:0.88rem}
  .badge{display:inline-block;background:#1a3a5c;color:#90caf9;border-radius:4px;padding:1px 6px;font-size:0.72rem;font-weight:600;margin-left:4px}
  .flight-count{font-size:0.78rem;color:#00b4d8;font-weight:600;margin-top:2px}

  /* RETURN PANEL */
  .return-panel{background:#0d1b2a;border:1px solid #00b4d8;border-radius:14px;padding:20px 24px;margin-top:24px;display:none}
  .return-panel h3{font-size:1rem;font-weight:700;color:#00b4d8;margin-bottom:12px}
  .return-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #1a3a5c;font-size:0.88rem}
  .return-row:last-child{border-bottom:none}
  .return-row .fn{color:#90caf9;font-weight:600;min-width:64px}
  .return-row .times{color:#e8eaf6}
  .return-row .freq{color:#b0bec5;font-size:0.78rem}

  footer{text-align:center;padding:20px;color:#455a64;font-size:0.78rem;border-top:1px solid #1a3a5c;margin-top:32px}
  @media(max-width:600px){
    header h1{font-size:1.1rem}
    .date-chip{padding:8px 10px;min-width:64px}
    .date-chip .day-num{font-size:1.1rem}
  }
</style>
</head>

const OWM_KEY = "712270799a8b7d594508656a8cdeeab7";
const DAYS = ["","Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const HKG = {lat:22.3080, lng:113.9185};

let selectedDate = new Date();
let sliderStartDate = new Date();
let weatherCache = {};
let selectedDest = null;

// ===================== DATE SLIDER =====================
function buildSlider() {
  const slider = document.getElementById('dateSlider');
  slider.innerHTML = '';
  const today = new Date();
  today.setHours(0,0,0,0);
  for (let i = 0; i < 14; i++) {
    const d = new Date(sliderStartDate);
    d.setDate(d.getDate() + i);
    d.setHours(0,0,0,0);
    const isToday = d.getTime() === today.getTime();
    const isSelected = d.toDateString() === selectedDate.toDateString();
    const chip = document.createElement('div');
    chip.className = 'date-chip' + (isSelected ? ' active' : '') + (isToday ? ' today' : '');
    chip.innerHTML = `
      <span class="day-name">${isToday ? 'Today' : DAY_NAMES[d.getDay()]}</span>
      <span class="day-num">${d.getDate()}</span>
      <span class="month">${MONTH_NAMES[d.getMonth()]}</span>`;
    chip.addEventListener('click', () => {
      selectedDate = new Date(d);
      onDateChange();
    });
    slider.appendChild(chip);
  }
}

function updateDateDisplay() {
  const d = selectedDate;
  const today = new Date();
  today.setHours(0,0,0,0);
  const sel = new Date(d);
  sel.setHours(0,0,0,0);
  let prefix = '';
  if (sel.getTime() === today.getTime()) prefix = 'Today — ';
  else {
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate()+1);
    if (sel.getTime() === tomorrow.getTime()) prefix = 'Tomorrow — ';
  }
  document.getElementById('selectedDateDisplay').textContent =
    `${prefix}${DAY_FULL[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`;
}

function onDateChange() {
  buildSlider();
  updateDateDisplay();
  renderGrid();
  updateMap();
  document.getElementById('returnPanel').style.display = 'none';
}

// ===================== MAP (Leaflet) =====================
let map, routeLines = [], destMarkers = [];

function drawMap() {
  map = L.map('map', {zoomControl:true, scrollWheelZoom:true}).setView([18, 105], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:18
  }).addTo(map);

  L.circleMarker([HKG.lat, HKG.lng], {radius:10, color:'#fff', weight:2, fillColor:'#00b4d8', fillOpacity:1})
    .addTo(map).bindTooltip('Hong Kong (HKG)', {permanent:true, direction:'top', className:'map-tip'});

  DESTINATIONS.forEach(dest => {
    const line = L.polyline([[HKG.lat, HKG.lng],[dest.lat, dest.lng]], {
      color:'#00b4d8', weight:1.5, dashArray:'6,4', opacity:0.4
    }).addTo(map);
    routeLines.push({line, iata:dest.iata});

    const marker = L.circleMarker([dest.lat, dest.lng], {
      radius:7, color:'#fff', weight:1.5, fillColor:'#ff6b35', fillOpacity:0.9
    }).addTo(map);
    marker.bindTooltip(`${dest.name} (${dest.iata})`, {direction:'top', className:'map-tip'});
    marker.on('click', () => showReturn(dest));
    destMarkers.push({marker, iata:dest.iata});
  });
}

function updateMap() {
  const dow = getSelectedDOW();
  destMarkers.forEach(({marker, iata}) => {
    const dest = DESTINATIONS.find(d => d.iata === iata);
    const flights = flightsForDay(dest.outbound, dow);
    if (flights.length === 0) {
      marker.setStyle({fillColor:'#455a64', fillOpacity:0.1, radius:3, weight:0.5, color:'#455a64'});
      marker.closeTooltip();
      marker.unbindTooltip();
      marker.bindTooltip(`${dest.name} — No flights`, {direction:'top', className:'map-tip'});
    } else {
      marker.setStyle({fillColor:'#00e676', fillOpacity:1, radius:9, weight:2, color:'#fff'});
      marker.unbindTooltip();
      marker.bindTooltip(`${dest.name} (${dest.iata}) — ${flights.length} flight${flights.length>1?'s':''}`, {direction:'top', className:'map-tip'});
    }
  });
  routeLines.forEach(({line, iata}) => {
    const dest = DESTINATIONS.find(d => d.iata === iata);
    const flights = flightsForDay(dest.outbound, dow);
    line.setStyle({
      opacity: flights.length === 0 ? 0.05 : 0.6,
      weight: flights.length === 0 ? 0.5 : 2,
      color: flights.length === 0 ? '#455a64' : '#00b4d8'
    });
  });
}

// ===================== FLIGHT LOGIC =====================
function getSelectedDOW() {
  const jsDay = selectedDate.getDay();
  return jsDay === 0 ? 7 : jsDay;
}

function flightsForDay(flights, dow) {
  return flights.filter(f => f.days.includes(dow));
}

function freqLabel(days) {
  if (days.length === 7) return "Daily";
  return days.map(d => DAYS[d]).join(", ");
}

// ===================== RENDER CARDS =====================
function renderGrid() {
  const dow = getSelectedDOW();
  const grid = document.getElementById('flightGrid');
  grid.innerHTML = '';
  let totalFlights = 0;
  let availableDests = 0;

  DESTINATIONS.forEach(dest => {
    const flights = flightsForDay(dest.outbound, dow);
    if (flights.length > 0) { totalFlights += flights.length; availableDests++; }
    const card = document.createElement('div');
    card.className = 'card' + (flights.length === 0 ? ' no-flight' : '');
    card.innerHTML = `
      <div class="card-head">
        <span class="dest">${dest.name}</span>
        <span class="iata">${dest.iata}</span>
      </div>
      <div class="card-body">
        ${flights.length === 0
          ? '<div class="no-flight-msg">No flights on this day</div>'
          : flights.map(f => `
              <div class="flight-row">
                <span class="fn">${f.fn}</span>
                <span class="times">${f.dep} → ${f.arr}</span>
                <span class="freq badge">${freqLabel(f.days)}</span>
              </div>`).join('')}
        <div class="weather-block" id="wx-${dest.iata}">
          <span style="color:#546e7a;font-size:0.82rem">Loading weather…</span>
        </div>
      </div>`;
    if (flights.length > 0) {
      card.addEventListener('click', () => showReturn(dest));
    }
    grid.appendChild(card);
    fetchWeather(dest);
  });

  document.getElementById('statFlights').textContent = totalFlights;
  document.getElementById('statDests').textContent = availableDests;
  document.getElementById('statNoFlight').textContent = DESTINATIONS.length - availableDests;
  document.getElementById('flightsTitle').textContent =
    `✈ ${totalFlights} Flights to ${availableDests} Destinations`;
}

// ===================== WEATHER =====================
async function fetchWeather(dest) {
  const el = document.getElementById(`wx-${dest.iata}`);
  if (!el) return;
  if (weatherCache[dest.iata]) { renderWeather(el, weatherCache[dest.iata]); return; }
  try {
    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${dest.lat}&lon=${dest.lng}&appid=${OWM_KEY}&units=metric`);
    const data = await res.json();
    weatherCache[dest.iata] = data;
    renderWeather(el, data);
  } catch(e) {
    el.innerHTML = '<span style="color:#546e7a;font-size:0.82rem">Weather unavailable</span>';
  }
}

function renderWeather(el, data) {
  if (!data || data.cod !== 200) { el.innerHTML = '<span style="color:#546e7a;font-size:0.82rem">Weather unavailable</span>'; return; }
  el.innerHTML = `
    <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png" alt="${data.weather[0].description}"/>
    <div>
      <div class="wt">${Math.round(data.main.temp)}°C</div>
      <div class="wd">${data.weather[0].description} · ${data.main.humidity}% humidity</div>
    </div>`;
}

// ===================== RETURN PANEL =====================
function showReturn(dest) {
  selectedDest = dest;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.card').forEach(c => {
    if (c.querySelector('.iata') && c.querySelector('.iata').textContent === dest.iata) c.classList.add('active');
  });
  const dow = getSelectedDOW();
  const allReturns = dest.inbound;
  const panel = document.getElementById('returnPanel');
  document.getElementById('returnTitle').textContent = `↩ Return Flights: ${dest.name} (${dest.iata}) → HKG`;
  document.getElementById('returnList').innerHTML = allReturns.map(f => {
    const available = f.days.includes(dow);
    return `<div class="return-row" style="${available ? '' : 'opacity:0.4'}">
      <span class="fn">${f.fn}</span>
      <span class="times">${f.dep} → ${f.arr}</span>
      <span class="freq badge">${freqLabel(f.days)}</span>
      ${available ? '<span class="badge" style="background:#00b4d8;color:#fff">Today</span>' : ''}
    </div>`;
  }).join('');
  panel.style.display = 'block';
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  today.setHours(0,0,0,0);
  selectedDate = new Date(today);
  sliderStartDate = new Date(today);

  buildSlider();
  updateDateDisplay();
  renderGrid();
  drawMap();
  updateMap();

  document.getElementById('prevWeek').addEventListener('click', () => {
    sliderStartDate.setDate(sliderStartDate.getDate() - 7);
    buildSlider();
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    sliderStartDate.setDate(sliderStartDate.getDate() + 7);
    buildSlider();
  });
});
</script>
